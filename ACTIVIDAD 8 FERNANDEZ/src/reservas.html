<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiro Sustentable - Reservas</title>
    <link rel="stylesheet" href="./estilos.css">
</head>

<body>

    <!-- Se mantiene el mismo layout general utilizado en index.html. -->
    <header class="cabecera">

        <a class="logo" href="index.html">
            <img src="./recursos/imagenes/logo.webp" alt="Retiro Sustentable">
        </a>

        <nav class="menu">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="reservas.html">Reservas</a></li>
            </ul>
        </nav>

    </header>

    <main class="principal">

        <h1>Reservas</h1>

        <h2>Contactanos</h2>

        <!-- El formulario permite recopilar los datos necesarios de la consulta. -->
        <form class="formulario" action="#" method="post">

            <div class="campo">
                <label for="nombre">Nombre de la persona que consulta</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" required>
            </div>

            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo">
                <label for="fecha-desde">Fecha desde</label>
                <input type="date" id="fecha-desde" name="fecha-desde" required>
            </div>

            <div class="campo">
                <label for="fecha-hasta">Fecha hasta</label>
                <input type="date" id="fecha-hasta" name="fecha-hasta" required>
            </div>

            <div class="campo">
                <label for="comentario">Comentario</label>
                <textarea id="comentario" name="comentario" rows="5"></textarea>
            </div>

            <button class="boton" type="submit">Enviar consulta</button>

        </form>

    </main>

    <footer class="pie">
        <p>&copy; 2026 Retiro Sustentable. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
